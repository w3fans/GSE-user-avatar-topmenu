name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install validation and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin libxml2-utils p7zip-full ripgrep gettext

      - name: Read extension metadata
        id: meta
        run: |
          UUID="$(node -p "JSON.parse(require('fs').readFileSync('metadata.json')).uuid")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION_TAG="$GITHUB_REF_NAME"
          else
            VERSION_TAG="v$(tr -d '[:space:]' < VERSION)"
            git checkout --detach "$VERSION_TAG"
          fi
          VERSION_TEXT="${VERSION_TAG#v}"
          MINOR="$(cut -d. -f2 <<< "$VERSION_TEXT")"
          test "$VERSION_TEXT" = "$(tr -d '[:space:]' < VERSION)"
          echo "uuid=${UUID}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_text=${VERSION_TEXT}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$((MINOR % 2))" >> "$GITHUB_OUTPUT"

      - name: Validate and build extension zip
        run: |
          if [[ "${{ steps.meta.outputs.version_tag }}" == *su ]]; then
            bundled="${{ steps.meta.outputs.uuid }}-${{ steps.meta.outputs.version_tag }}.shell-extension.zip"
            test -f "$bundled"
            mkdir -p dist
            cp "$bundled" "dist/$bundled"
            unzip -p "$bundled" extension.js | grep -F "['sudo', '-n', 'dmidecode', '--type', '17']"
            (cd dist && sha256sum "$bundled" > "${bundled%.zip}.sha256")
          else
            chmod +x build validate.sh
            ./build
          fi
          test -f "dist/${{ steps.meta.outputs.uuid }}-${{ steps.meta.outputs.version_tag }}.shell-extension.zip"
          test -f "dist/${{ steps.meta.outputs.uuid }}-${{ steps.meta.outputs.version_tag }}.shell-extension.sha256"

      - name: Write release notes from changelog
        run: node tools/release-notes.mjs '${{ steps.meta.outputs.version_tag }}' > dist/release-notes.md

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.version_tag }}
          name: ${{ steps.meta.outputs.version_tag }}
          body_path: dist/release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == '1' }}
          files: |
            dist/${{ steps.meta.outputs.uuid }}-${{ steps.meta.outputs.version_tag }}.shell-extension.zip
            dist/${{ steps.meta.outputs.uuid }}-${{ steps.meta.outputs.version_tag }}.shell-extension.sha256
          generate_release_notes: false

      - name: Fill historical release notes from changelog
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const sections = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            for (const release of releases) {
              if (release.tag_name === '${{ steps.meta.outputs.version_tag }}') continue;
              const version = release.tag_name.replace(/^v/, '').replace(/su$/, '');
              const section = sections.find(text => text.split('\n')[0].trim() === version);
              if (!section || (release.body || '').includes('## Changes')) continue;
              const body = `## Changes\n\n${section.slice(section.indexOf('\n')).trim()}\n\n` +
                (release.tag_name.endsWith('su')
                  ? 'Publicly downloadable personal SU build; not for EGO submission. Hardware controls require separately installed helpers and sudo permissions.'
                  : 'Public extension package. SU-only changes listed above are excluded from this artifact.') +
                `\n\n${release.body || ''}`;
              await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, body,
              });
            }

      - name: Retire older personal releases
        if: endsWith(github.ref_name, 'su')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const release of releases) {
              if (release.tag_name.endsWith('su') && release.tag_name !== context.ref.replace('refs/tags/', '')) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`,
                  });
                } catch (error) {
                  if (![404, 422].includes(error.status)) throw error;
                }
              }
            }
